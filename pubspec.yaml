name: location_alarm_prototype
description: A location based alarm app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  http: ^1.5.0
  vibration: ^3.1.3
  flutter_local_notifications: ^19.4.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_polyline_points: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true